; Production defaults for every app built on this image. Each value comes from
; an environment variable whose default the Dockerfile's prod stage sets, so an
; app changes one in its compose file instead of shipping an ini of its own.
;
; PHP reads conf.d after php.ini, so whatever this file sets overrides an app's
; own php.ini. It therefore leaves alone what apps set themselves: memory,
; upload, post and execution-time limits stay theirs.

; OPcache. PHP's own defaults (128 MB, 8 MB of interned strings, 10,000 files)
; are too small for a Laravel app with Filament or Livewire: compiling every
; file of one such app takes about 19,000 scripts, 575 MB and 95 MB of strings.
opcache.enable = ${PHP_OPCACHE_ENABLE}
opcache.memory_consumption = ${PHP_OPCACHE_MEMORY_CONSUMPTION}
opcache.interned_strings_buffer = ${PHP_OPCACHE_INTERNED_STRINGS_BUFFER}
opcache.max_accelerated_files = ${PHP_OPCACHE_MAX_ACCELERATED_FILES}

; The code is baked into the image and every deploy starts new containers, so
; checking each file for changes only costs time.
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE_FREQ}

; Paths do not move inside a running container either.
realpath_cache_size = ${PHP_REALPATH_CACHE_SIZE}
realpath_cache_ttl = ${PHP_REALPATH_CACHE_TTL}

; Hardening. No app needs to announce its PHP version or to track upload
; progress in the session, a feature known from file-inclusion attacks.
expose_php = Off
session.upload_progress.enabled = ${PHP_SESSION_UPLOAD_PROGRESS_ENABLED}
